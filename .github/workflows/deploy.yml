name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download high-resolution social preview image
        run: |
          mkdir -p public
          curl -L --fail --retry 3 -o public/og-image-jose-ferreccio-v2.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3HmQhGIgB0TFCiURLf7Kdm8HLwe/8c3c22f0-7c7b-45e2-a9a0-42b7f164e3d9.jpg"
          file public/og-image-jose-ferreccio-v2.jpg

      - name: Install, build, and upload Astro site
        uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
